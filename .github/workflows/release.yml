name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version to validate without publishing (vX.Y.Z)'
        required: true
        default: 'v0.1.0'
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Validate version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Expected vX.Y.Z' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip check
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build application and updater
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          python scripts/build_release.py --stage onedir --version $version
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          python -c "import subprocess; subprocess.run(['dist/BehindWatch/BehindWatch.exe', '--smoke-test'], check=True, timeout=60)"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer and checksums
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          python scripts/build_release.py --stage installer --version $version
      - name: Smoke test installed application
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $setup = Resolve-Path "dist-installer/BehindWatch-Setup-v$version-x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'BehindWatch Smoke Install'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=`"$installDir`"")
          $first = Start-Process $setup -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($first.ExitCode -ne 0) { throw "Installer failed: $($first.ExitCode)" }
          New-Item -ItemType Directory -Force (Join-Path $installDir 'data') | Out-Null
          Set-Content (Join-Path $installDir 'data/preserve-marker.txt') 'keep'
          $second = Start-Process $setup -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($second.ExitCode -ne 0) { throw "Overwrite install failed: $($second.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDir 'data/preserve-marker.txt'))) { throw 'Overwrite removed data' }
          python -c "import subprocess,sys; subprocess.run([sys.argv[1], '--smoke-test'], check=True, timeout=60)" (Join-Path $installDir 'BehindWatch.exe')
      - name: Smoke test update handoff
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $setup = Resolve-Path "dist-installer/BehindWatch-Setup-v$version-x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'BehindWatch Smoke Install'
          $helperDir = Join-Path $env:RUNNER_TEMP 'BehindWatch Update Helper'
          New-Item -ItemType Directory -Force $helperDir | Out-Null
          $helper = Join-Path $helperDir 'BehindWatchUpdater.exe'
          Copy-Item (Join-Path $installDir 'BehindWatchUpdater.exe') $helper
          python -c "import subprocess,sys; old=subprocess.Popen([sys.executable,'-c','import time;time.sleep(5)']); subprocess.run([sys.argv[1],'--wait-pid',str(old.pid),'--installer',sys.argv[2]], check=True, timeout=180); old.wait()" $helper $setup
          python -c "import subprocess,sys; subprocess.run([sys.argv[1], '--smoke-test'], check=True, timeout=60)" (Join-Path $installDir 'BehindWatch.exe')
      - name: Resolve release notes
        id: notes
        shell: pwsh
        run: |
          $path = "release-notes/$env:RELEASE_TAG.md"
          if (Test-Path $path) {
            "body_path=$path" >> $env:GITHUB_OUTPUT
          } else {
            throw "Release notes missing: $path"
          }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: BehindWatch ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          fail_on_unmatched_files: true
          files: |
            dist-installer/BehindWatch-Setup-v*-x64.exe
            dist-installer/SHA256SUMS.txt
